# AIflex production topology — example docker-compose.
#
# Three application services share the same image; AIFLEX_ROLE selects
# what each one does:
#
#   web    → Next.js HTTP, no worker
#   worker → BullMQ consumer, no HTTP
#   cron   → tsx scripts/cron.ts, runs scheduled jobs
#
# Postgres + Redis are external by default (Supabase / Neon / Upstash /
# managed RDS). The included `postgres` / `redis` services are
# convenience for self-hosted single-VPS setups — comment them out if
# you point DATABASE_URL / REDIS_URL at managed services.
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file .env.production \
#     up -d --build
#
# Scale workers independently of web:
#   docker compose -f docker-compose.production.yml \
#     up -d --scale worker=4

x-aiflex-base: &aiflex-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [aiflex]

services:
  # -----------------------------------------------------------------
  # Application tier
  # -----------------------------------------------------------------

  web:
    <<: *aiflex-base
    command: ["node", "node_modules/next/dist/bin/next", "start"]
    environment:
      NODE_ENV: production
      AIFLEX_ROLE: web
      PORT: "3000"
      # Web pods do NOT spawn the worker — keep them lean.
      AIFLEX_WEB_RUNS_WORKER: "0"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  worker:
    <<: *aiflex-base
    command: ["npx", "tsx", "scripts/worker.ts"]
    environment:
      NODE_ENV: production
      AIFLEX_ROLE: worker
      JOB_CONCURRENCY: "2"
    healthcheck:
      # Worker has no HTTP — use a process check via heartbeat file
      test: ["CMD", "sh", "-c", "test $$(($$(date +%s) - $$(stat -c %Y /tmp/.aiflex-worker-alive 2>/dev/null || echo 0))) -lt 180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 4G  # video generation is memory-hungry

  cron:
    <<: *aiflex-base
    command: ["npx", "tsx", "scripts/cron.ts"]
    environment:
      NODE_ENV: production
      AIFLEX_ROLE: cron
    deploy:
      replicas: 1  # NEVER more than 1 — cron must be a singleton
      resources:
        limits:
          memory: 512M

  # -----------------------------------------------------------------
  # Infra tier (comment out if using managed services)
  # -----------------------------------------------------------------

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiflex
      POSTGRES_USER: aiflex
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiflex -d aiflex"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets: [postgres_password]
    networks: [aiflex]
    # Internal only — DO NOT expose 5432 to the host in production.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass-file
      - /run/secrets/redis_password
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$(cat /run/secrets/redis_password) ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets: [redis_password]
    networks: [aiflex]

  # -----------------------------------------------------------------
  # Backup sidecar (optional)
  # -----------------------------------------------------------------

  backup:
    image: postgres:17-alpine  # for pg_dump
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache aws-cli gnupg coreutils &&
        # Hourly snapshot
        while true; do
          /usr/local/bin/backup-db.sh snapshot || echo "[backup] FAILED"
          sleep 3600
        done
    networks: [aiflex]

volumes:
  pgdata:
  redisdata:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password

networks:
  aiflex:
    driver: bridge
